<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pothole Detection - API Client</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; }
  #dropzone { border: 2px dashed #999; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 16px; }
  button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:disabled { background: #999; cursor: not-allowed; }
  #result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f4f4f5; display: none; }
  #result img { max-width: 100%; border-radius: 6px; margin-top: 12px; }
  .kpi { display: flex; gap: 20px; margin-top: 10px; }
  .kpi div { flex: 1; }
  .kpi span { display: block; font-size: 20px; font-weight: 600; }
  .error { color: #b91c1c; }
</style>
</head>
<body>

<h1>🛣️ Pothole Detection — API Demo</h1>
<p>This page talks to the Flask API (<code>api.py</code>) over HTTP. Upload an image, it calls
<code>POST /api/detect</code>, and the JSON response is rendered below.</p>

<div id="dropzone">
  <input type="file" id="imageInput" accept="image/*">
</div>
<button id="runBtn">Run Detection</button>

<div id="result"></div>

<script>
  const runBtn = document.getElementById("runBtn");
  const imageInput = document.getElementById("imageInput");
  const resultBox = document.getElementById("result");

  const API_BASE = "http://localhost:5000"; // change if hosted elsewhere

  runBtn.addEventListener("click", async () => {
    const file = imageInput.files[0];
    if (!file) {
      alert("Please choose an image first.");
      return;
    }

    runBtn.disabled = true;
    runBtn.textContent = "Running...";
    resultBox.style.display = "none";

    // FormData is how you send a file over HTTP in a REST request
    const formData = new FormData();
    formData.append("image", file);

    try {
      const response = await fetch(`${API_BASE}/api/detect`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Unknown error");
      }

      renderResult(data);
    } catch (err) {
      resultBox.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      resultBox.style.display = "block";
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "Run Detection";
    }
  });

  function renderResult(data) {
    resultBox.innerHTML = `
      <div class="kpi">
        <div>Defects<span>${data.defect_count}</span></div>
        <div>Severity<span>${data.severity}</span></div>
        <div>Confidence<span>${(data.confidence * 100).toFixed(0)}%</span></div>
        <div>Time<span>${data.inference_ms} ms</span></div>
      </div>
      <img src="${API_BASE}${data.annotated_image_url}" alt="Annotated result">
    `;
    resultBox.style.display = "block";
  }
</script>

</body>
</html>
